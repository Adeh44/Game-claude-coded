plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.adeh.errance'
    compileSdk 34

    defaultConfig {
        applicationId "com.adeh.errance"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    // Clé de signature fixe (debug, sans valeur secrète) : chaque nouvel APK
    // peut s'installer par-dessus l'ancien sans perdre la sauvegarde.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.games.activity
}
