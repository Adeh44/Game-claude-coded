name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  regles:
    name: Tests des règles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: regles
      - name: Tests
        run: cargo test -p errance_core -p errance_sim
      - name: Clippy
        run: cargo clippy -p errance_core -p errance_sim -- -D warnings

  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable + cible Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked || cargo install cargo-ndk
      - name: Bibliothèque native (.so)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build --release -p errance_game
      - name: APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Errance.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Errance-apk
          path: Errance.apk
      - name: Publier en téléchargement direct (release « apk-latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest Errance.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Errance — dernier APK (${GITHUB_SHA::7})" \
            --notes "APK construit automatiquement depuis la branche ${GITHUB_REF_NAME}. Ouvre ce lien sur ton téléphone, télécharge Errance.apk et installe-le."
